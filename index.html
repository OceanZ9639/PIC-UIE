<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIC-UIE demos</title>
<style>
  body { margin: 0; background: #fff; color: #1a2328; font-family: "Segoe UI", sans-serif; font-size: 18px; line-height: 1.5; }
  main { width: min(960px, calc(100% - 32px)); margin: 28px auto 64px; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  figure { margin: 28px 0; }
  video, img { width: 100%; height: auto; display: block; background: #000; }
  figcaption { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>PIC-UIE demos</h1>
  <p>Code: <a href="https://github.com/OceanZ9639/PIC-UIE">OceanZ9639/PIC-UIE</a></p>

  <figure>
    <video controls playsinline preload="metadata" src="demo/videos/flsea_canyons_flatiron.mp4"></video>
    <figcaption>FLSea canyons, flatiron.</figcaption>
  </figure>
  <figure>
    <video controls playsinline preload="metadata" src="demo/videos/flsea_canyons_u_canyon.mp4"></video>
    <figcaption>FLSea canyons, U canyon.</figcaption>
  </figure>
  <figure>
    <video controls playsinline preload="metadata" src="demo/videos/flsea_red_sea_coral_table_loop.mp4"></video>
    <figcaption>FLSea Red Sea, coral table loop.</figcaption>
  </figure>
  <figure>
    <video controls playsinline preload="metadata" src="demo/videos/flsea_red_sea_dice_path.mp4"></video>
    <figcaption>FLSea Red Sea, dice path.</figcaption>
  </figure>
  <figure>
    <img src="demo/figures/PIC-UIE.png" alt="PIC-UIE overview">
    <figcaption>Model overview.</figcaption>
  </figure>
</main>
</body>
</html>
